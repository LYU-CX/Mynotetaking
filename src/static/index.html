<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            --ink: #20243a;
            --muted: #77809a;
            --accent: #635bdb;
            --accent-soft: #f0efff;
            --line: #e6e9f2;
            --surface: #ffffff;
            --shadow: 0 18px 48px rgba(54, 62, 108, 0.11), 0 2px 8px rgba(54, 62, 108, 0.04);
            --focus-ring: 0 0 0 4px rgba(99, 91, 219, 0.16);
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 12% 8%, rgba(255, 255, 255, 0.9), transparent 34%),
                linear-gradient(135deg, #e8f0ff 0%, #f0edff 52%, #e7f6ff 100%);
        }

        .container {
            width: min(1240px, 100%);
            margin: 0 auto;
            min-height: 100vh;
            padding: 42px 28px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: clamp(1.6rem, 3vw, 2.1rem);
            letter-spacing: -0.055em;
            font-weight: 750;
        }

        .header p {
            margin-top: 5px;
            color: var(--muted);
            font-size: 0.97rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: minmax(270px, 0.82fr) minmax(0, 2fr);
            gap: 22px;
            flex: 1;
            align-items: start;
        }

        .sidebar {
            min-width: 0;
            padding: 22px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .note-editor {
            min-width: 0;
            min-height: 540px;
            padding: 26px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            margin-bottom: 12px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink);
            background: #fbfcff;
            font: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .new-note-btn {
            width: 100%;
            margin-bottom: 18px;
            padding: 12px 16px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg, #7069e8, #5852c9);
            font: inherit;
            font-size: 0.94rem;
            font-weight: 650;
            cursor: pointer;
            box-shadow: 0 7px 16px rgba(99, 91, 219, 0.2);
            transition: all 0.2s ease;
        }

        .btn,
        .new-note-btn {
            border-radius: 12px;
            font-family: inherit;
            font-weight: 650;
            transition: all 0.2s ease;
        }

        .notes-list {
            max-height: min(62vh, 620px);
            overflow-y: auto;
            padding-right: 3px;
        }

        .note-item {
            margin-bottom: 9px;
            padding: 14px;
            border: 1px solid transparent;
            border-radius: 13px;
            cursor: pointer;
            background: #f7f8fc;
            transition: all 0.2s ease;
        }

        .note-item:hover {
            border-color: #d9d7ff;
            background: #f4f3ff;
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(70, 66, 140, 0.08);
        }

        .note-item.active {
            border-color: #c9c6ff;
            background: linear-gradient(135deg, #f3f2ff, #f8f7ff);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .note-title {
            min-width: 0;
            margin-bottom: 0;
            color: var(--ink);
            font-size: 0.94rem;
            font-weight: 650;
            overflow-wrap: anywhere;
        }

        .note-item-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 5px;
        }

        .note-pin {
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            margin: -6px -6px 0 0;
            border: 1px solid transparent;
            border-radius: 9px;
            color: #8b93a9;
            background: transparent;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.65;
            transition: all 0.2s ease;
        }

        .note-pin:hover,
        .note-pin:focus-visible {
            border-color: #e3e1ff;
            color: #625bd4;
            background: #efeeff;
            opacity: 1;
        }

        .note-pin[aria-pressed="true"] {
            color: #625bd4;
            background: #efeeff;
            opacity: 1;
        }

        .note-pin:active {
            transform: scale(0.92);
        }

        .note-preview {
            color: #727b93;
            font-size: 0.84rem;
            line-height: 1.5;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            margin-top: 9px;
            color: #969db0;
            font-size: 0.73rem;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .editor-title {
            min-width: 0;
            color: var(--ink);
            font-size: clamp(1.2rem, 2.5vw, 1.55rem);
            letter-spacing: -0.04em;
            overflow-wrap: anywhere;
        }

        .editor-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .btn {
            min-height: 40px;
            padding: 9px 13px;
            border: 1px solid transparent;
            border-radius: 11px;
            cursor: pointer;
            font: inherit;
            font-size: 0.84rem;
            font-weight: 650;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn:hover,
        .new-note-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow: 0 8px 18px rgba(56, 64, 115, 0.18);
        }

        .btn:active,
        .new-note-btn:active {
            transform: translateY(0) scale(0.98);
            filter: brightness(0.97);
            box-shadow: 0 2px 6px rgba(56, 64, 115, 0.12);
        }

        .btn:focus-visible,
        .new-note-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(99, 91, 219, 0.22);
        }

        .btn-save {
            color: #fff;
            background: #1c9b69;
            box-shadow: 0 5px 12px rgba(28, 155, 105, 0.17);
        }

        .btn-delete {
            color: #fff;
            background: #df5364;
            box-shadow: 0 5px 12px rgba(223, 83, 100, 0.15);
        }

        .target-language {
            min-height: 40px;
            padding: 8px 30px 8px 11px;
            border: 1px solid var(--line);
            border-radius: 11px;
            color: #414963;
            background: #fff;
            font: inherit;
            font-size: 0.84rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-translate {
            color: #fff;
            background: #5869dc;
            box-shadow: 0 5px 12px rgba(88, 105, 220, 0.18);
        }

        .btn:disabled,
        .new-note-btn:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
            filter: none;
            box-shadow: none;
        }

        .form-group {
            margin-bottom: 21px;
        }

        .form-label {
            display: block;
            margin-bottom: 9px;
            color: #454c64;
            font-size: 0.88rem;
            font-weight: 650;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink);
            background: #fdfdff;
            font: inherit;
            font-size: 0.98rem;
            transition: all 0.2s ease;
        }

        .form-input {
            min-height: 48px;
            padding: 12px 14px;
        }

        .form-textarea {
            min-height: 340px;
            padding: 15px;
            resize: vertical;
            line-height: 1.75;
        }

        .content-stats {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
            color: #8b93a9;
            font-size: 0.77rem;
            font-variant-numeric: tabular-nums;
        }

        .empty-state {
            display: grid;
            place-items: center;
            align-content: center;
            flex: 1;
            min-height: 250px;
            padding: 42px 20px;
            border: 1px dashed #dfe2ef;
            border-radius: 16px;
            color: var(--muted);
            background: linear-gradient(145deg, #fcfcff, #f8f9ff);
            text-align: center;
        }

        .empty-state::before {
            content: "✍️";
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin-bottom: 16px;
            border-radius: 18px;
            background: #efeeff;
            font-size: 1.6rem;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 1.25rem;
            letter-spacing: -0.03em;
        }

        .empty-state p {
            max-width: 300px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 24px 12px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .error {
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid #f3c7ce;
            border-radius: 11px;
            color: #913a4a;
            background: #fff1f3;
            font-size: 0.88rem;
        }

        .success {
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 1px solid #c6ead9;
            border-radius: 11px;
            color: #246c4e;
            background: #edfaf3;
            font-size: 0.88rem;
        }

        :focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .search-box:focus,
        .form-input:focus,
        .form-textarea:focus,
        .target-language:focus {
            outline: none;
            border-color: #8c86ef;
            box-shadow: var(--focus-ring);
            background: #fff;
        }

        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .notes-list::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: #d8dbeb;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #b8bcda;
        }

        @media (max-width: 900px) {
            .container {
                padding: 30px 20px;
            }

            .main-content {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .sidebar {
                order: 1;
            }

            .note-editor {
                order: 2;
                min-height: 480px;
            }

            .notes-list {
                max-height: 300px;
            }
        }

        @media (max-width: 520px) {
            .container {
                padding: 22px 14px;
            }

            .header {
                margin-bottom: 20px;
            }

            .sidebar,
            .note-editor {
                padding: 17px;
                border-radius: 17px;
            }

            .editor-header {
                align-items: flex-start;
                margin-bottom: 20px;
            }

            .editor-actions {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .target-language,
            .editor-actions .btn {
                width: 100%;
            }

            .form-textarea {
                min-height: 260px;
            }

            .note-editor {
                min-height: 420px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <select class="target-language" id="targetLanguage" aria-label="Translation language">
                            <option value="Chinese">Chinese</option>
                            <option value="English">English</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Korean">Korean</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                        </select>
                        <button class="btn btn-translate" id="translateBtn">🌐 Translate</button>
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                        <div class="content-stats" id="contentStats" aria-live="polite">
                            <span id="characterCount">0 characters</span>
                            <span aria-hidden="true">·</span>
                            <span id="wordCount">0 words</span>
                        </div>
                    </div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadNotes();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('translateBtn').addEventListener('click', () => this.translateNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));
                
                // Auto-save on content change (debounced)
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };
                
                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', () => {
                    this.updateContentStats();
                    autoSave();
                });
            }

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList(notes = this.notes, emptyMessage = 'No notes yet. Create your first note!') {
                const notesList = document.getElementById('notesList');
                
                if (notes.length === 0) {
                    notesList.innerHTML = `<div class="empty-state"><p>${this.escapeHtml(emptyMessage)}</p></div>`;
                    return;
                }

                notesList.innerHTML = notes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-item-heading">
                            <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                            <button class="note-pin" type="button"
                                    aria-label="${note.is_pinned ? 'Unpin' : 'Pin'} note"
                                    aria-pressed="${Boolean(note.is_pinned)}"
                                    title="${note.is_pinned ? 'Unpin note' : 'Pin note'}"
                                    onclick="event.stopPropagation(); noteTaker.togglePin(${note.id})">📌</button>
                        </div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
                this.updateContentStats();
            }

            createNewNote() {
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('editorTitle').textContent = 'New Note';
                this.updateContentStats();
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
                document.getElementById('deleteBtn').style.display =
                    this.currentNote && this.currentNote.id ? '' : 'none';
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.currentNote = null;
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    this.showEditor();
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                }
            }

            async translateNote() {
                if (!this.currentNote) return;

                const note = this.currentNote;
                const titleInput = document.getElementById('noteTitle');
                const contentInput = document.getElementById('noteContent');
                const originalTitle = titleInput.value;
                const originalContent = contentInput.value;
                const targetLanguage = document.getElementById('targetLanguage').value;
                const translateButton = document.getElementById('translateBtn');
                const translateButtonText = translateButton.textContent;

                if (!originalTitle.trim() && !originalContent.trim()) {
                    this.showMessage('Enter a title or content to translate.', 'error');
                    return;
                }

                const translateText = async (text) => {
                    if (!text.trim()) return text;

                    const response = await fetch('/api/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text, target_language: targetLanguage })
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || 'Failed to translate note');
                    }
                    if (typeof result.translation !== 'string') {
                        throw new Error('Invalid translation response');
                    }
                    return result.translation;
                };

                translateButton.disabled = true;
                translateButton.textContent = 'Translating...';
                this.showMessage('Translating note...', 'loading');

                try {
                    const [translatedTitle, translatedContent] = await Promise.all([
                        translateText(originalTitle),
                        translateText(originalContent)
                    ]);

                    if (this.currentNote !== note ||
                        titleInput.value !== originalTitle ||
                        contentInput.value !== originalContent) {
                        this.showMessage('The note changed while translating; the result was not applied.', 'error');
                        return;
                    }

                    titleInput.value = translatedTitle;
                    contentInput.value = translatedContent;
                    document.getElementById('editorTitle').textContent =
                        translatedTitle || 'Untitled Note';
                    titleInput.dispatchEvent(new Event('input', { bubbles: true }));
                    contentInput.dispatchEvent(new Event('input', { bubbles: true }));
                    this.showMessage('Note translated successfully.', 'success');
                } catch (error) {
                    this.showMessage(`Error translating note: ${error.message}`, 'error');
                } finally {
                    translateButton.disabled = false;
                    translateButton.textContent = translateButtonText;
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            async togglePin(noteId) {
                const note = this.notes.find(item => item.id === noteId);
                if (!note) return;

                try {
                    const response = await fetch(`/api/notes/${noteId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ is_pinned: !note.is_pinned })
                    });
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || 'Failed to update pin status');
                    }

                    this.notes = this.notes
                        .map(item => item.id === noteId ? result : item)
                        .sort((left, right) =>
                            Number(Boolean(right.is_pinned)) - Number(Boolean(left.is_pinned)) ||
                            new Date(right.updated_at) - new Date(left.updated_at)
                        );
                    if (this.currentNote && this.currentNote.id === noteId) {
                        this.currentNote = result;
                    }
                    this.searchNotes(document.getElementById('searchBox').value);
                } catch (error) {
                    this.showMessage(`Error updating pin: ${error.message}`, 'error');
                }
            }

            searchNotes(query) {
                const filteredNotes = query.trim() === '' ? this.notes : 
                    this.notes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );

                if (filteredNotes.length === 0) {
                    this.renderNotesList(filteredNotes, 'No notes found matching your search.');
                    return;
                }
                this.renderNotesList(filteredNotes);
            }

            updateContentStats() {
                const content = document.getElementById('noteContent').value;
                const characterCount = Array.from(content).length;
                const wordCount = typeof Intl.Segmenter === 'function'
                    ? Array.from(
                        new Intl.Segmenter(undefined, { granularity: 'word' }).segment(content)
                    ).filter(segment => segment.isWordLike).length
                    : (content.trim() ? content.trim().split(/\s+/).length : 0);

                document.getElementById('characterCount').textContent =
                    `${characterCount} ${characterCount === 1 ? 'character' : 'characters'}`;
                document.getElementById('wordCount').textContent =
                    `${wordCount} ${wordCount === 1 ? 'word' : 'words'}`;
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                const messageElement = document.createElement('div');
                messageElement.className = type;
                messageElement.textContent = message;
                messageArea.replaceChildren(messageElement);
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
